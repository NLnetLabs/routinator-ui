name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn build --base /ui
      - run: zip -r public.zip public/
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: public.zip
